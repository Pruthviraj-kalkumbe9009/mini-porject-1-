<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Classroom Scheduler</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/app-pages.css">
    <link rel="stylesheet" href="css/theme.css">
    <script src="js/theme.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <header class="login-header">
        <div class="container nav-container">
            <div class="logo">🎓 Smart Scheduler</div>
            <div class="action-row">
                <button class="btn btn-outline" id="themeToggle" type="button" aria-label="Switch to dark mode">◐</button>
                <a href="index.html" class="btn btn-outline">Home</a>
            </div>
        </div>
    </header>
    <section class="login-section">
        <div class="login-card">
            <h1>Welcome back</h1>
            <p>Sign in, then we route you by role. First-time students go to onboarding.</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email / Roll number</label>
                    <input type="text" id="email" name="email" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <div class="form-group">
                    <label for="role">Role</label>
                    <select id="role" name="role" required>
                        <option value="student">Student</option>
                        <option value="faculty">Faculty</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="options">
                    <label><input type="checkbox" id="rememberMe"> Remember email</label>
                </div>
                <button class="btn btn-primary login-btn" type="submit">Login</button>
            </form>
            <p id="loginMessage" class="form-message" role="alert" hidden></p>
            <p class="demo-hint">
                Demo: admin@smart.edu / Admin@123 · faculty@smart.edu / Faculty@123 ·
                student@smart.edu / Student@123 · newstudent@smart.edu / Student@123 (onboarding)
            </p>
            <p class="signup-text">No account? <a href="signup.html">Sign up</a></p>
        </div>
    </section>
    <script src="js/demo-store.js"></script>
    <script src="js/api.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
