<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Smart Classroom Scheduler</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/signup.css">
    <link rel="stylesheet" href="css/app-pages.css">
    <link rel="stylesheet" href="css/theme.css">
    <script src="js/theme.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body class="signup-page">

    <header class="signup-header">

        <div class="container nav-container">

            <div class="logo">

                🎓 Smart Scheduler

            </div>

            <div class="action-row">
                <button class="btn btn-outline" id="themeToggle" type="button" aria-label="Switch to dark mode">◐</button>
                <a href="index.html" class="btn btn-outline">Home</a>
            </div>

        </div>

    </header>

    <section class="signup-section">

        <div class="signup-card">

            <h1>Create Your Account</h1>

            <p>

                Register to access Smart Classroom & Timetable Scheduler

            </p>

            <form id="signupForm">

                <div class="form-group">

                    <label for="fullName">Full Name</label>

                    <input type="text" id="fullName" name="name" placeholder="Enter Full Name" required>

                </div>

                <div class="form-group">

                    <label for="email">Email</label>

                    <input type="email" id="email" placeholder="Enter Email" required>

                </div>

                <div class="form-group">

                    <label for="rollNo">Roll Number</label>

                    <input type="text" id="rollNo" placeholder="Enter Roll Number">

                </div>

                <div class="form-group">

                    <label for="password">Password</label>

                    <input type="password" id="password" placeholder="Create Password" required>

                </div>

                <div class="form-group">

                    <label for="confirmPassword">Confirm Password</label>

                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

                </div>

                <div class="form-group">

                    <label for="role">Select Role</label>

                    <select id="role">

                        <option value="student">Student</option>
                        <option value="faculty">Faculty</option>

                    </select>

                </div>

                <button type="submit" class="btn btn-primary signup-btn">

                    Create Account

                </button>

            </form>

            <p id="signupMessage" class="form-message" role="alert" hidden></p>

            <p class="login-link">

                Already have an account?

                <a href="login.html">

                    Login

                </a>

            </p>

        </div>

    </section>

    <script src="js/demo-store.js"></script>
    <script src="js/api.js"></script>
    <script src="js/signup.js"></script>

</body>

</html>
